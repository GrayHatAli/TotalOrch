services:
  omniroute:
    image: ${OMNIROUTE_IMAGE:-omniroute:local}
    restart: unless-stopped
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
    environment:
      PORT: 20128

  total-orch:
    build: ..
    restart: unless-stopped
    depends_on:
      - omniroute
    ports:
      - "${TOTAL_ORCH_PORT:-8080}:8080"
    environment:
      ORCHESTRATOR_ENV: ${ORCHESTRATOR_ENV:-production}
      TOTAL_ORCH_API_KEY: ${TOTAL_ORCH_API_KEY:?set TOTAL_ORCH_API_KEY}
      TOTAL_ORCH_HOST: 0.0.0.0
      TOTAL_ORCH_PORT: 8080
      ORCHESTRATOR_REGISTRY_DATABASE_PATH: /var/lib/total-orch/registry.db
      GATEWAY_TYPE: ${GATEWAY_TYPE:-omniroute}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      ORCHESTRATOR_WORKFLOW_APPLY_CHANGES: ${ORCHESTRATOR_WORKFLOW_APPLY_CHANGES:-false}
      ORCHESTRATOR_REQUEST_MAX_BODY_BYTES: ${ORCHESTRATOR_REQUEST_MAX_BODY_BYTES:-1048576}
      ORCHESTRATOR_RATE_LIMIT_PER_MINUTE: ${ORCHESTRATOR_RATE_LIMIT_PER_MINUTE:-120}
      OMNIROUTE_BASE_URL: http://omniroute:20128
    volumes:
      - total-orch-data:/var/lib/total-orch

volumes:
  total-orch-data:
