[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "total-orch"
version = "0.1.0"
description = "TotalOrch — the Orchestrator control plane for model intelligence, semantic routing, and agent workflows."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
  "build>=1.2,<2",
]

[project.scripts]
total-orch = "total_orch.api:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["total_orch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
